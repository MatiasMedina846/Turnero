<div class="page-header">
  <h1>Empleados</h1>
  <p>Gestión del personal</p>
</div>

<form class="form-card" (ngSubmit)="crear()" #form="ngForm">
  <div class="form-grid">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" [(ngModel)]="nuevo.nombre" placeholder="Nombre del empleado" required>
    </div>
    <div class="form-group">
      <label for="especialidad">Especialidad</label>
      <input id="especialidad" name="especialidad" [(ngModel)]="nuevo.especialidad" placeholder="Ej: Corte, Barbería" required>
    </div>
  </div>
  <button type="submit" style="margin-top:1rem;">Agregar Empleado</button>
</form>

<div class="card">
  <table>
    <thead>
      <tr><th>Nombre</th><th>Especialidad</th></tr>
    </thead>
    <tbody>
      @for (e of empleados; track e.id) {
        <tr>
          <td style="font-weight:500;">{{ e.nombre }}</td>
          <td><span class="badge">{{ e.especialidad }}</span></td>
        </tr>
      } @empty {
        <tr><td colspan="2" class="empty-state">No hay empleados registrados</td></tr>
      }
    </tbody>
  </table>
</div>
