<div class="page-header">
  <h1>Servicios</h1>
  <p>Catálogo de servicios con su duración</p>
</div>

<form class="form-card" (ngSubmit)="crear()" #form="ngForm">
  <div class="form-grid">
    <div class="form-group">
      <label for="nombre">Nombre del Servicio</label>
      <input id="nombre" name="nombre" [(ngModel)]="nuevo.nombre" placeholder="Ej: Corte Clásico" required>
    </div>
    <div class="form-group">
      <label for="duracion">Duración (minutos)</label>
      <input id="duracion" name="duracion" type="number" [(ngModel)]="nuevo.duracionMinutos" required>
    </div>
  </div>
  <button type="submit" style="margin-top:1rem;">Agregar Servicio</button>
</form>

<div class="card">
  <table>
    <thead>
      <tr><th>Servicio</th><th>Duración</th></tr>
    </thead>
    <tbody>
      @for (s of servicios; track s.id) {
        <tr>
          <td style="font-weight:500;">{{ s.nombre }}</td>
          <td><span class="badge">{{ s.duracionMinutos }} min</span></td>
        </tr>
      } @empty {
        <tr><td colspan="2" class="empty-state">No hay servicios registrados</td></tr>
      }
    </tbody>
  </table>
</div>
