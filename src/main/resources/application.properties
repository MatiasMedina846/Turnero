spring.application.name=turnos
server.port=${PORT:8080}

# Database connection. Credentials come from environment variables, never from the repo.
# Defaults point to the local PostgreSQL started with `docker compose up -d`.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/turnos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Origin allowed by the CORS filter (Angular dev server by default)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Health endpoint for the hosting platform (only /actuator/health is exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
